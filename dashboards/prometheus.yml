global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'adapt-data-metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
    honor_labels: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(http_request_duration_.*|auth_error_rate|cache_.*|database_.*|query_duration_ms|slow_query_count|cpu_usage_percent|memory_usage_mb|http_error_rate|service_health_status|packet_loss_percent|network_.*)'
        action: keep

