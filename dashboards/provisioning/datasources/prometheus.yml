apiVersion: 1

datasources:
  # The UID must match the one baked into the dashboards; override at export
  # time with: adapt-data dashboards --datasource-uid <uid>
  - name: ADAPT Prometheus
    uid: adapt-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
