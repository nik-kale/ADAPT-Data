name: ecommerce
description: Storefront topology with checkout, catalog and fulfilment paths
version: "1.0"

services:
  - name: cdn-edge
    type: frontend
    instances: 6
    region: global
    metadata:
      version: "2024.4"
      tier: critical
      sla_target: 99.99

  - name: storefront-web
    type: frontend
    instances: 8
    region: us-east-1
    metadata:
      version: "5.2.0"
      tier: critical
      sla_target: 99.95
    dependencies:
      - target: api-gateway
        type: http
        critical: true

  - name: api-gateway
    type: gateway
    instances: 4
    region: us-east-1
    metadata:
      version: "1.9.3"
      tier: critical
      sla_target: 99.99
    dependencies:
      - target: auth-service
        type: http
        critical: true
      - target: catalog-service
        type: http
        critical: true
      - target: cart-service
        type: http
        critical: true
      - target: checkout-service
        type: http
        critical: true

  - name: auth-service
    type: auth
    instances: 3
    region: us-east-1
    metadata:
      version: "2.4.1"
      tier: critical
      sla_target: 99.99
    dependencies:
      - target: postgres-primary
        type: database
        critical: true
      - target: redis-session
        type: cache
        critical: true

  - name: catalog-service
    type: api
    instances: 6
    region: us-east-1
    metadata:
      version: "3.1.0"
      tier: high
      sla_target: 99.9
    dependencies:
      - target: elasticsearch
        type: storage
        critical: true
      - target: postgres-replica
        type: database
        critical: false

  - name: cart-service
    type: api
    instances: 4
    region: us-east-1
    metadata:
      version: "1.7.2"
      tier: critical
      sla_target: 99.95
    dependencies:
      - target: redis-session
        type: cache
        critical: true

  - name: checkout-service
    type: api
    instances: 4
    region: us-east-1
    metadata:
      version: "2.0.5"
      tier: critical
      sla_target: 99.99
    dependencies:
      - target: payment-gateway
        type: http
        critical: true
      - target: inventory-service
        type: http
        critical: true
      - target: postgres-primary
        type: database
        critical: true
      - target: order-queue
        type: queue
        critical: false

  - name: payment-gateway
    type: api
    instances: 3
    region: us-east-1
    metadata:
      version: "4.2.0"
      tier: critical
      sla_target: 99.99
    dependencies:
      - target: postgres-primary
        type: database
        critical: true

  - name: inventory-service
    type: api
    instances: 3
    region: us-east-1
    metadata:
      version: "1.8.0"
      tier: high
      sla_target: 99.9
    dependencies:
      - target: postgres-primary
        type: database
        critical: true

  - name: fulfilment-worker
    type: worker
    instances: 4
    region: us-east-1
    metadata:
      version: "1.3.1"
      tier: medium
      sla_target: 99.0
    dependencies:
      - target: order-queue
        type: queue
        critical: true
      - target: postgres-primary
        type: database
        critical: true

  - name: postgres-primary
    type: database
    instances: 1
    region: us-east-1
    metadata:
      version: "15.4"
      tier: critical
      sla_target: 99.99

  - name: postgres-replica
    type: database
    instances: 2
    region: us-east-1
    metadata:
      version: "15.4"
      tier: high
      sla_target: 99.9

  - name: redis-session
    type: cache
    instances: 3
    region: us-east-1
    metadata:
      version: "7.2.0"
      tier: critical
      sla_target: 99.95

  - name: elasticsearch
    type: storage
    instances: 3
    region: us-east-1
    metadata:
      version: "8.11.0"
      tier: high
      sla_target: 99.9

  - name: order-queue
    type: queue
    instances: 3
    region: us-east-1
    metadata:
      version: "3.12.0"
      tier: high
      sla_target: 99.9

dependencies:
  - from: cdn-edge
    to: storefront-web
    type: http
    critical: true
  - from: postgres-replica
    to: postgres-primary
    type: database
    critical: false
